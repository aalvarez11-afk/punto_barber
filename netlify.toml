# Configuración de despliegue de Punto Barber en Netlify
# Sitio estático: no hay que compilar nada.

[build]
  publish = "."
  command = ""

# El HTML no se cachea, para que un cambio en el sitio se vea enseguida.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El catálogo tampoco: así un cambio de precio o de stock se ve enseguida.
[[headers]]
  for = "/datos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las imágenes sí se cachean: cambian poco y así el sitio carga rápido.
# Solo img/: si la regla cubriera /assets/*, Netlify la sumaría a las de abajo.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# JS y CSS no: config.js trae el número de WhatsApp y las reglas de venta, y un
# cambio tiene que verse ya, no al día siguiente. Pesan poco y el navegador
# solo los vuelve a bajar si cambiaron (responde 304).
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
